<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova — Voice Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #d4a843; --gold-dim: #a07828;
    --bg: #0a0a0a; --surface: #111111; --surface2: #1a1a1a;
    --border: rgba(212,168,67,0.18); --text: #f0ead8; --text-muted: #7a7060;
    --red: #e24b4a; --green: #97C459;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; border-radius: 50%; background: var(--text); animation: twinkle var(--dur) ease-in-out infinite; opacity: 0; }
  @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:var(--op)} }

  .app { position: relative; z-index: 1; width: 100%; max-width: 660px; height: 100vh; display: flex; flex-direction: column; padding: 1.5rem; gap: 1.1rem; }

  .header { text-align: center; }
  .logo { font-size: 10px; letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase; font-family: 'DM Mono', monospace; margin-bottom: 0.25rem; }
  .title { font-size: 2rem; font-weight: 800; line-height: 1; }
  .title span { color: var(--gold); }
  .subtitle { font-size: 10px; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 0.25rem; }

  /* Orb */
  .orb-area { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; }
  .orb-wrap { position: relative; width: 130px; height: 130px; }
  .orb {
    width: 130px; height: 130px; border-radius: 50%;
    border: 1.5px solid var(--border);
    background: radial-gradient(circle at 38% 38%, #2a2010, #0d0d0d 65%);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.2s; user-select: none;
  }
  .orb:hover { transform: scale(1.04); }
  .orb:active { transform: scale(0.97); }
  .orb-ring { position: absolute; inset: -8px; border-radius: 50%; border: 1.5px solid transparent; pointer-events: none; }
  .orb-ring.listening { border-color: var(--red); animation: pulse 1s ease-in-out infinite; }
  .orb-ring.speaking  { border-color: var(--green); animation: pulse 0.8s ease-in-out infinite; }
  .orb-ring.thinking  { border-color: var(--gold); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.15);opacity:.15} }
  .orb-icon { font-size: 36px; transition: all 0.3s; }
  .orb-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }

  /* Wave */
  .wave { display: flex; align-items: center; gap: 3px; height: 28px; opacity: 0; transition: opacity 0.3s; }
  .wave.active { opacity: 1; }
  .wave-bar { width: 3px; border-radius: 2px; background: var(--gold); height: 4px; animation: wv 0.55s ease-in-out infinite paused; }
  .wave.active .wave-bar { animation-play-state: running; }
  @keyframes wv { 0%,100%{height:4px} 50%{height:24px} }
  .wave-bar:nth-child(1){animation-delay:0s}.wave-bar:nth-child(2){animation-delay:.1s}
  .wave-bar:nth-child(3){animation-delay:.2s}.wave-bar:nth-child(4){animation-delay:.15s}
  .wave-bar:nth-child(5){animation-delay:.05s}.wave-bar:nth-child(6){animation-delay:.25s}
  .wave-bar:nth-child(7){animation-delay:.1s}

  /* Config */
  .config { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
  .cfg-label { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--text-muted); }
  .cfg-select { background: var(--surface); border: 0.5px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 10px; border-radius: 6px; padding: 3px 7px; cursor: pointer; outline: none; max-width: 150px; }

  /* Conversation */
  .conversation { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; padding: 0 0.2rem; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .conversation:empty::after { content: 'Tap the orb and start speaking…'; color: var(--text-muted); font-size: 12px; font-family: 'DM Mono', monospace; text-align: center; display: block; margin-top: 2rem; }
  .msg { max-width: 88%; padding: 0.6rem 0.9rem; border-radius: 14px; font-size: 13px; line-height: 1.55; animation: fadeUp 0.25s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { align-self: flex-end; background: #1e1a0e; border: 1px solid rgba(212,168,67,0.25); }
  .msg.assistant { align-self: flex-start; background: var(--surface2); border: 1px solid var(--border); }
  .msg-label { font-size: 9px; font-family: 'DM Mono', monospace; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 3px; }
  .msg.user .msg-label { color: var(--gold-dim); text-align: right; }
  .msg.assistant .msg-label { color: var(--text-muted); }

  .typing { display: flex; align-items: center; gap: 4px; padding: 0.6rem 0.9rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; width: 68px; align-self: flex-start; animation: fadeUp 0.25s ease; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
  .dot:nth-child(1){animation:blink 1s 0s infinite}
  .dot:nth-child(2){animation:blink 1s .2s infinite}
  .dot:nth-child(3){animation:blink 1s .4s infinite}
  @keyframes blink { 0%,100%{opacity:.2;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }

  /* Status */
  .status-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.55rem 0.9rem; border: 0.5px solid var(--border); border-radius: 10px; background: var(--surface); font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
  .sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); margin-right: 6px; display: inline-block; transition: background .3s; }
  .sdot.on { background: var(--green); }
  .sdot.err { background: var(--red); }
  .clear-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 10px; padding: 0; transition: color .2s; }
  .clear-btn:hover { color: var(--gold); }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">
  <div class="header">
    <div class="logo">Uneeq Interns · Voice Assistant</div>
    <h1 class="title">N<span>ov</span>a</h1>
    <p class="subtitle">stt · flask + claude api · tts — running on localhost:5000</p>
  </div>

  <div class="orb-area">
    <div class="orb-wrap">
      <div class="orb-ring" id="orbRing"></div>
      <div class="orb" id="orb" onclick="toggleListen()">
        <span class="orb-icon" id="orbIcon">🎙️</span>
      </div>
    </div>
    <div class="wave" id="wave">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <div class="orb-label" id="orbLabel">tap to speak</div>
  </div>

  <div class="config">
    <span class="cfg-label">voice:</span>
    <select class="cfg-select" id="voiceSelect"></select>
    <span class="cfg-label">speed:</span>
    <select class="cfg-select" id="speedSelect">
      <option value="0.8">0.8×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
  </div>

  <div class="conversation" id="conv"></div>

  <div class="status-bar">
    <div><span class="sdot on" id="sdot"></span><span id="statusText">ready</span></div>
    <button class="clear-btn" onclick="clearConv()">clear ×</button>
  </div>
</div>

<script>
// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 100; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random()*2+0.5;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--dur:${2+Math.random()*4}s;--op:${0.1+Math.random()*0.45};animation-delay:${Math.random()*5}s`;
  starsEl.appendChild(s);
}

// TTS voices
const voiceSelect = document.getElementById('voiceSelect');
let voices = [];
function loadVoices() {
  voices = speechSynthesis.getVoices();
  voiceSelect.innerHTML = '';
  const en = voices.filter(v => v.lang.startsWith('en'));
  const list = en.length ? en : voices;
  list.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = v.name.replace(/Microsoft |Google /g, '');
    voiceSelect.appendChild(o);
  });
}
speechSynthesis.addEventListener('voiceschanged', loadVoices);
loadVoices();

// State
let recognition = null;
let isListening = false;
let isSpeaking = false;
let history = [];

const conv = document.getElementById('conv');
const orbRing = document.getElementById('orbRing');
const orbIcon = document.getElementById('orbIcon');
const orbLabel = document.getElementById('orbLabel');
const wave = document.getElementById('wave');
const sdot = document.getElementById('sdot');
const statusText = document.getElementById('statusText');

function setStatus(msg, type) {
  statusText.textContent = msg;
  sdot.className = 'sdot' + (type === 'on' ? ' on' : type === 'err' ? ' err' : '');
}

function setOrbState(state) {
  orbRing.className = 'orb-ring' + (state ? ' ' + state : '');
  const icons = { listening: '🛑', speaking: '🔊', thinking: '⏳', idle: '🎙️' };
  const labels = { listening: 'listening…', speaking: 'tap to stop', thinking: 'thinking…', idle: 'tap to speak' };
  orbIcon.textContent = icons[state] || '🎙️';
  orbLabel.textContent = labels[state] || 'tap to speak';
  wave.classList.toggle('active', state === 'listening');
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="msg-label">${role === 'user' ? 'you' : 'nova'}</div>${text.replace(/</g,'&lt;')}`;
  conv.appendChild(div);
  conv.scrollTop = conv.scrollHeight;
}

function addTyping() {
  removeTyping();
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typing';
  d.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  conv.appendChild(d);
  conv.scrollTop = conv.scrollHeight;
}
function removeTyping() { document.getElementById('typing')?.remove(); }

function toggleListen() {
  if (isSpeaking) { speechSynthesis.cancel(); isSpeaking = false; setOrbState('idle'); setStatus('ready', 'on'); return; }
  if (isListening) { recognition?.stop(); return; }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus('❌ SpeechRecognition not supported — use Chrome', 'err'); return; }

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    setOrbState('listening');
    setStatus('listening…', 'on');
  };

  recognition.onresult = async (e) => {
    const text = e.results[0][0].transcript.trim();
    if (text) await handleInput(text);
  };

  recognition.onerror = (e) => {
    setStatus('mic error: ' + e.error, 'err');
    isListening = false; setOrbState('idle');
  };

  recognition.onend = () => {
    isListening = false;
    if (!isSpeaking) { setOrbState('idle'); setStatus('ready', 'on'); }
  };

  try { recognition.start(); }
  catch(e) { setStatus('Cannot start mic: ' + e.message, 'err'); }
}

async function handleInput(text) {
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  addTyping();
  setOrbState('thinking');
  setStatus('thinking…', '');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    removeTyping();
    history.push({ role: 'assistant', content: data.reply });
    addMsg('assistant', data.reply);
    speak(data.reply);
  } catch(e) {
    removeTyping();
    setStatus('Error: ' + e.message, 'err');
    addMsg('assistant', '⚠️ ' + e.message);
    setOrbState('idle');
  }
}

function speak(text) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  const en = voices.filter(v => v.lang.startsWith('en'));
  const list = en.length ? en : voices;
  const idx = parseInt(voiceSelect.value) || 0;
  if (list[idx]) utt.voice = list[idx];
  utt.rate = parseFloat(document.getElementById('speedSelect').value);
  isSpeaking = true;
  setOrbState('speaking');
  setStatus('speaking…', 'on');
  utt.onend = utt.onerror = () => { isSpeaking = false; setOrbState('idle'); setStatus('ready', 'on'); };
  speechSynthesis.speak(utt);
}

function clearConv() {
  history = []; conv.innerHTML = '';
  speechSynthesis.cancel();
  isSpeaking = false; setOrbState('idle'); setStatus('ready', 'on');
}
</script>
</body>
</html>
